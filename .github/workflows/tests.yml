name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[test]'
      - run: pytest -q
      - name: pure-Python fallback (no C kernel)
        run: ERDOS_ENGINE_NO_NATIVE=1 pytest -q tests/test_nt.py tests/test_catalog_literature.py
